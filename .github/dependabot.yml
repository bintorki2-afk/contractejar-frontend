# تحديثات التبعيات التلقائية (ف21): أسبوعياً، بحد أقصى 5 طلبات دمج مفتوحة لكل نظام.
# CI (.github/workflows/ci.yml) يفحص كل PR بالبناء والتحقق من الأنواع قبل الدمج.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    groups:
      # تحديثات الباتش/المينور في PR واحد لتقليل الضجيج؛ الميجور يبقى منفصلاً.
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
      time: "06:00"
      timezone: "Asia/Riyadh"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
